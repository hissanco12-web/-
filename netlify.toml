[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# لا تؤرشف محركات البحث لوحة التحكم
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# الملفات الحقيقية (sitemap.xml و robots.txt وملف تحقق Google) تُخدم قبل هذه القاعدة تلقائياً
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
